name: Debug MercadoLibre API
on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run motor_mercadolibre and save combined debug
        run: |
          python - <<'PY'
          import os, json, requests
          from scraper import motor_mercadolibre

          print("SUPABASE_KEY present:", bool(os.environ.get("SUPABASE_KEY")))
          url = "https://listado.mercadolibre.com.pe/ropa-accesorios/ropa-deportiva/nuevo/hombre/ropa-adidas_NoIndex_True?sb=all_mercadolibre"

          # Ejecutar motor
          productos = motor_mercadolibre(url, limite=300)
          print("Productos encontrados:", len(productos))
          for p in productos[:5]:
              print(p)

          # Llamada cruda a la API para debug
          api_url = "https://api.mercadolibre.com/sites/MPE/search"
          params = {"q": "ropa adidas", "sort": "price_asc", "limit": 50}
          headers = {"User-Agent": "Mozilla/5.0"}
          try:
              resp = requests.get(api_url, params=params, headers=headers, timeout=12)
              raw_api = resp.json() if resp.status_code == 200 else {"http_status": resp.status_code, "text": resp.text[:2000]}
          except Exception as e:
              raw_api = {"error": str(e)}

          # Guardar todo en un único archivo combinado
          os.makedirs("ml_debug", exist_ok=True)
          combined = {
              "metadata": {
                  "url_tested": url,
                  "limit": 300,
                  "timestamp": __import__("datetime").datetime.utcnow().isoformat() + "Z"
              },
              "productos": productos,
              "raw_api": raw_api
          }
          with open("ml_debug/combined_debug.json", "w", encoding="utf-8") as f:
              json.dump(combined, f, ensure_ascii=False, indent=2)
          print("Debug guardado en ml_debug/combined_debug.json")
          PY

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercadolibre-debug
          path: ml_debug/combined_debug.json
