name: Debug MercadoLibre API
on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run motor_mercadolibre and save debug
        run: |
          python - <<'PY'
          import os
          from scraper import motor_mercadolibre
          print("SUPABASE_KEY present:", bool(os.environ.get("SUPABASE_KEY")))
          url = "https://listado.mercadolibre.com.pe/ropa-accesorios/ropa-deportiva/nuevo/hombre/ropa-adidas_NoIndex_True?sb=all_mercadolibre"
          productos = motor_mercadolibre(url, limite=300)
          print("Productos encontrados:", len(productos))
          for p in productos[:5]:  # mostrar solo los primeros 5
              print(p)
          # Guardar debug en archivo
          import json, os
          os.makedirs("ml_debug", exist_ok=True)
          with open("ml_debug/resp_debug.json", "w", encoding="utf-8") as f:
              json.dump(productos, f, ensure_ascii=False, indent=2)
          PY

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercadolibre-debug
          path: ml_debug/resp_debug.json
