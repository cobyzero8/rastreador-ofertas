name: Patrullero de Ofertas Coby 24/7

on:
  schedule:
    # Corre automáticamente cada 45 minutos
    - cron: '*/45 * * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  cron_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargando Repositorio
        uses: actions/checkout@v4

      - name: Configurando Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalando Dependencias
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests beautifulsoup4 supabase urllib3 pandas streamlit st-annotated-text curl_cffi; fi

      - name: Ejecutando Patrullaje de Ofertas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          python -c "import os; from patrol import revisar_ofertas; print(revisar_ofertas('TODOS'))"
